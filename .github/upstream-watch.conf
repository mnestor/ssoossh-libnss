# What .github/scripts/upstream-watch.sh watches. The script's header says
# what each kind of entry means and what is checked for it.
#
# Not listed, on purpose:
#   * glibc. It is the operating system's, and patched by the host's own
#     updates, not by this tree.
#   * The CI container tags. almalinux:8 names the deployment target, so
#     moving it is a support decision and not an update.
#   * The GitHub Actions, which Dependabot covers (see
#     .github/dependabot.yml).

# vendored <name> <owner/repo> <local dir> <upstream dir> <file>...
vendored jsmn zserge/jsmn third_party/jsmn . jsmn.h
