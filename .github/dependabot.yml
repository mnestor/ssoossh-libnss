# Dependabot configuration.
#
# This is a C project with no package manager: glibc comes from the distro
# and third_party/jsmn is vendored source. So the only thing here with an
# upstream version to track is the GitHub Actions the workflow calls.
#
# Deliberately not covered: third_party/jsmn. It is a vendored header pinned
# to an upstream tag and a hash in its README, not a manifest Dependabot
# reads; it has to be bumped by hand.
version: 2

updates:
  - package-ecosystem: github-actions
    # "/" is the whole repo for this ecosystem: it covers .github/workflows/.
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One PR a week for everything rather than one per action.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
